name: shuttlemaster
description: "A mobile application desgined to help NSBM students and lecturers manage their daily university transport."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.18.1

  cupertino_icons: ^1.0.8

  lottie: ^3.3.1
  
  mailer: ^6.4.1
  twilio_flutter: ^0.9.0
  
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  
  provider: ^6.1.2
  
  shared_preferences: ^2.5.2

  paypal_sdk: ^1.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
